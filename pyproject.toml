[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consentvault"
version = "0.1.0"
description = "Consent & Data Privacy Management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
  "python-jose[cryptography]>=3.3", "passlib>=1.7", "bcrypt>=4.2",
  "httpx>=0.27", "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "faker>=28", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI Depends() in defaults is the framework idiom.
# E501: long route signatures stay readable; ruff format handles the rest.
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_return_any = false
disallow_untyped_defs = false
