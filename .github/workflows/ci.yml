name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: consentvault
          POSTGRES_PASSWORD: consentvault
          POSTGRES_DB: consentvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consentvault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://consentvault:consentvault@localhost:5432/consentvault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Type check (mypy)
        run: mypy app
      - name: Test with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=80
